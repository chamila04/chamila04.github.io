name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL || secrets.VITE_GITHUB_URL }}
          VITE_GITHUB_USERNAME: ${{ vars.VITE_GITHUB_USERNAME || secrets.VITE_GITHUB_USERNAME }}
          VITE_LINKEDIN_URL: ${{ vars.VITE_LINKEDIN_URL || secrets.VITE_LINKEDIN_URL }}
          VITE_LINKEDIN_USERNAME: ${{ vars.VITE_LINKEDIN_USERNAME || secrets.VITE_LINKEDIN_USERNAME }}
          VITE_EMAIL: ${{ vars.VITE_EMAIL || secrets.VITE_EMAIL }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_TEMPLATE_ID_ME: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID_ME }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
